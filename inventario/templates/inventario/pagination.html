<div class="pagination" style="margin-top: 1rem; display: flex; justify-content: center; align-items: center; gap: 10px;">
    {% if page_obj.has_previous %}
        <a href="?page=1{% if q %}&q={{ q }}{% endif %}{% if categoria_id %}&categoria={{ categoria_id }}{% endif %}" class="btn btn-secondary">&laquo; Primera</a>
        <a href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q }}{% endif %}{% if categoria_id %}&categoria={{ categoria_id }}{% endif %}" class="btn btn-secondary">Anterior</a>
    {% endif %}

    <span style="color: var(--text-primary); font-weight: bold;">
        Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}.
    </span>

    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q }}{% endif %}{% if categoria_id %}&categoria={{ categoria_id }}{% endif %}" class="btn btn-secondary">Siguiente</a>
        <a href="?page={{ page_obj.paginator.num_pages }}{% if q %}&q={{ q }}{% endif %}{% if categoria_id %}&categoria={{ categoria_id }}{% endif %}" class="btn btn-secondary">Última &raquo;</a>
    {% endif %}
</div>
