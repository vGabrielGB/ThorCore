<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrothor | Verificación en 2 Pasos</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'inventario/css/styles.css' %}">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            text-align: center;
        }
        .auth-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 24px;
            background: rgba(108, 92, 231, 0.1);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }
        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 24px;
        }
        .form-input-code {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid var(--panel-border);
            background: rgba(0, 0, 0, 0.1);
            color: var(--text-primary);
            font-size: 2rem;
            letter-spacing: 12px;
            text-align: center;
            font-weight: 700;
            transition: all 0.3s;
        }
        [data-theme="light"] .form-input-code {
            background: rgba(255, 255, 255, 0.5);
        }
        .form-input-code:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.2);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: var(--shadow-glow);
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }
        .back-link:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="glass-panel auth-card">
            <div class="auth-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" style="width: 40px; height: 40px;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            
            <h1 class="auth-title">Verificación 2FA</h1>
            <p class="auth-subtitle">Hemos enviado un código de 6 dígitos a tu correo electrónico. Ingresa el código a continuación.</p>
            
            {% if messages %}
                <div style="margin-bottom: 20px; text-align: left;">
                    {% for message in messages %}
                        <div style="padding: 12px; border-radius: 6px; background-color: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); font-size: 0.9rem;">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <input type="text" id="code" name="code" class="form-input-code" required autocomplete="off" placeholder="------" maxlength="6" pattern="\d{6}">
                </div>
                <button type="submit" class="btn-submit">Verificar Código</button>
            </form>
            
            <a href="{% url 'inventario:login' %}" class="back-link">Cancelar y volver al Login</a>
        </div>
    </div>
    
    <script>
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
    </script>
</body>
</html>
